<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Card</title>

    <style>
        body {
            background-color: #e6f2ff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .restaurant {
            background-color: white;
            border: 2px solid #e23744;
            margin: 30px auto;
            padding: 20px;
            width: 300px;
        }

        .restaurant h2 {
            border-bottom: 1px solid gray;
            padding-bottom: 10px;
        }

        .restaurant p {
            padding: 5px;
            margin: 5px;
        }
    </style>
</head>
<body>

    <h1>Restaurant Listing</h1>

    <div class="restaurant">
        <h2>Spice Garden</h2>
        <p>Cuisine: North Indian</p>
        <p>Rating: 4.5 / 5</p>
    </div>

</body>
</html>
