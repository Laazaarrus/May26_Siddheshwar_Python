<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp Notification</title>

    <style>
        body {
            background-color: #e6f2ff;
            font-family: Arial, sans-serif;
            text-align: center;
            height: 1500px;
        }

        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25D366;
            color: white;
            padding: 15px 20px;
            margin: 10px;
            border-radius: 30px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>WhatsApp Chat Notification</h1>

    <p>Scroll down the page to test the fixed notification.</p>

    <div class="notification">
        WhatsApp: 1 New Message
    </div>

</body>
</html>
