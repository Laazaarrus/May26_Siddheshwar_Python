<!DOCTYPE html>
<html>
<head>
    <title>Restaurant List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-4">

        <h2>Restaurants</h2>

        <div class="card p-3 mb-3">
            <h4>Spice Garden</h4>
            <p class="text-success">Rating: 4.5 Stars</p>
            <p class="text-primary">Offer: 20% off</p>
            <p class="text-success">Open Now</p>
        </div>

        <div class="card p-3 mb-3">
            <h4>Burger House</h4>
            <p class="text-success">Rating: 4.2 Stars</p>
            <p class="text-warning">Offer: Free Fries</p>
            <p class="text-danger">Closed</p>
        </div>

        <div class="card p-3 mb-3">
            <h4>Green Leaf Cafe</h4>
            <p class="text-success">Rating: 4.7 Stars</p>
            <p class="text-info">Offer: 10% off drinks</p>
            <p class="text-success">Open Now</p>
        </div>

    </div>

</body>
</html>
