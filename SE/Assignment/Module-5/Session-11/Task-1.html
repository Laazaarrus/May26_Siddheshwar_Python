<!DOCTYPE html>
<html>
<head>
    <title>Product Card Spacing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <h2 class="text-center mt-3">Product Cards</h2>

    <div class="card m-1 p-1">
        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400"
             class="card-img-top" style="height:150px; object-fit:contain;">
        <div class="card-body">
            <h5>Headphones</h5>
        </div>
    </div>

    <div class="card m-3 p-3">
        <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=400"
             class="card-img-top" style="height:150px; object-fit:contain;">
        <div class="card-body">
            <h5>Laptop</h5>
        </div>
    </div>

    <div class="card m-4 p-4">
        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"
             class="card-img-top" style="height:150px; object-fit:contain;">
        <div class="card-body">
            <h5>Smart Watch</h5>
        </div>
    </div>

</body>
</html>
