<!DOCTYPE html>
<html>
<head>
    <title>Spotify Playlist</title>

    <style>
        .playlist-item {
            background-color: #222222;
            color: white;
            padding: 15px;
            margin: 8px;
        }

        #playing {
            background-color: #1db954;
            color: black;
        }
    </style>
</head>
<body>

    <h1>My Spotify Playlist</h1>

    <div class="playlist-item">
        Blinding Lights - The Weeknd
    </div>

    <div class="playlist-item" id="playing">
        <strong>Now Playing:</strong> Perfect - Ed Sheeran
    </div>

    <div class="playlist-item">
        Shape of You - Ed Sheeran
    </div>

</body>
</html>
