<!DOCTYPE html>
<html>
<head>
    <title>Spotify Playlist</title>

    <style>
        body {
            background-color: #e6f2ff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .playlist {
            display: flex;
            justify-content: space-evenly;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px;
        }

        .song {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #222222;
            color: white;
            width: 180px;
            height: 100px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h1>My Spotify Playlist</h1>

    <div class="playlist">

        <div class="song">
            <p>Blinding Lights<br>The Weeknd</p>
        </div>

        <div class="song">
            <p>Perfect<br>Ed Sheeran</p>
        </div>

        <div class="song">
            <p>Shape of You<br>Ed Sheeran</p>
        </div>

        <div class="song">
            <p>Starboy<br>The Weeknd</p>
        </div>

        <div class="song">
            <p>Believer<br>Imagine Dragons</p>
        </div>

    </div>

</body>
</html>
