<!DOCTYPE html>
<html>
<head>
    <title>Social App Icons</title>

    <style>
        body {
            background-color: #e6f2ff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            margin: 40px;
        }

        .container img {
            width: 70px;
            height: 70px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <h1>My Favorite Apps</h1>

    <div class="container">
        <img src="https://cdn.simpleicons.org/instagram/E4405F"
             alt="Instagram">

        <img src="https://cdn.simpleicons.org/whatsapp/25D366"
             alt="WhatsApp">

        <img src="https://cdn.simpleicons.org/zomato/E23744"
             alt="Zomato">

        <img src="https://cdn.simpleicons.org/spotify/1DB954"
             alt="Spotify">
    </div>

</body>
