<!DOCTYPE html>
<html>
<head>
    <title>Featured Playlists</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #e8f5e9;
        }

        .playlist-img {
            height: 180px;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <div class="container mt-4">
        <h1 class="text-center mb-4">Featured Playlists</h1>

        <div class="row">

            <div class="col-12 col-md-4 mb-3">
                <div class="card h-100">
                    <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400"
                         class="card-img-top playlist-img" alt="Party music">
                    <div class="card-body">
                        <h5>Party Hits</h5>
                        <p>Music for every celebration.</p>
                        <a href="https://open.spotify.com/" class="btn btn-success">Listen Now</a>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-4 mb-3">
                <div class="card h-100">
                    <img src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?w=400"
                         class="card-img-top playlist-img" alt="Music studio">
                    <div class="card-body">
                        <h5>Chill Vibes</h5>
                        <p>Relax with your favourite songs.</p>
                        <a href="https://open.spotify.com/" class="btn btn-success">Listen Now</a>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-4 mb-3">
                <div class="card h-100">
                    <img src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=400"
                         class="card-img-top playlist-img" alt="Live music">
                    <div class="card-body">
                        <h5>Top Hits</h5>
                        <p>Listen to popular music tracks.</p>
                        <a href="https://open.spotify.com/" class="btn btn-success">Listen Now</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
