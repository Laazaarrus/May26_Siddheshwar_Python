<!DOCTYPE html>
<html>
<head>
    <title>Product Showcase</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: lightblue;
        }

        .product-img {
            height: 150px;
            object-fit: contain;
            padding: 10px;
        }
    </style>
</head>

<body>

    <div class="container mt-4">
        <h1 class="text-center mb-4">Featured Products</h1>

        <div class="row">

            <div class="col-6 col-md-3 mb-3">
                <div class="card h-100">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400"
                         class="card-img-top product-img" alt="Headphones">
                    <div class="card-body">
                        <h6>Headphones</h6>
                        <p>₹1,499</p>
                        <button class="btn btn-primary btn-sm">Buy Now</button>
                    </div>
                </div>
            </div>

            <div class="col-6 col-md-3 mb-3">
                <div class="card h-100">
                    <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=400"
                         class="card-img-top product-img" alt="Laptop">
                    <div class="card-body">
                        <h6>Laptop</h6>
                        <p>₹45,999</p>
                        <button class="btn btn-primary btn-sm">Buy Now</button>
                    </div>
                </div>
            </div>

            <div class="col-6 col-md-3 mb-3">
                <div class="card h-100">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"
                         class="card-img-top product-img" alt="Smart watch">
                    <div class="card-body">
                        <h6>Smart Watch</h6>
                        <p>₹2,499</p>
                        <button class="btn btn-primary btn-sm">Buy Now</button>
                    </div>
                </div>
            </div>

            <div class="col-6 col-md-3 mb-3">
                <div class="card h-100">
                    <img src="https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=400"
                         class="card-img-top product-img" alt="Speaker">
                    <div class="card-body">
                        <h6>Bluetooth Speaker</h6>
                        <p>₹1,999</p>
                        <button class="btn btn-primary btn-sm">Buy Now</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
