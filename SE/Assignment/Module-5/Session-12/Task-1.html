<!DOCTYPE html>
<html>
<head>
    <title>Music Artist</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #222;
            color: white;
            text-align: center;
        }

        img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
        }
    </style>
</head>

<body>

    <div class="container mt-5">
        <img src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=400"
             alt="Music artist">

        <h1 class="mt-3">Alex Music</h1>

        <p>
            I am a music artist who loves creating songs and sharing
            music with people around the world.
        </p>

        <a href="https://www.instagram.com/" class="btn btn-danger m-2">
            <i class="bi bi-instagram"></i> Instagram
        </a>

        <a href="https://www.youtube.com/" class="btn btn-primary m-2">
            <i class="bi bi-youtube"></i> YouTube
        </a>

        <a href="https://open.spotify.com/" class="btn btn-success m-2">
            <i class="bi bi-spotify"></i> Spotify
        </a>
    </div>

</body>
</html>
