<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Bootstrap Layout</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
        }

        .movie-section {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }

        .movie-poster {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="container my-5">

        <h1 class="text-center mb-4">Now Showing</h1>

        <div class="row g-4 align-items-center">

            <!-- First Column: Movie Poster -->
            <div class="col-12 col-md-6">
                <div class="movie-section">
                    <img
                        src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=600"
                        alt="Movie theatre poster"
                        class="movie-poster">
                </div>
            </div>

            <!-- Second Column: Movie Details -->
            <div class="col-12 col-md-6">
                <div class="movie-section">

                    <h2>The Adventure Begins</h2>

                    <p><strong>Genre:</strong> Action, Adventure</p>

                    <p><strong>Rating:</strong> 8.5/10</p>

                    <p>
                        An exciting adventure filled with action,
                        mystery and unexpected discoveries.
                    </p>

                    <button class="btn btn-danger">Book Now</button>

                </div>
            </div>

        </div>

    </div>

</body>
</html>
