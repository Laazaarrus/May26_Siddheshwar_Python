<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .product-card {
            display: flex;
            align-items: center;
            background-color: white;
            max-width: 800px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
            gap: 25px;
        }

        .product-card img {
            width: 250px;
            height: 250px;
            object-fit: contain;
        }

        .product-details {
            flex: 1;
        }

        .product-details h2 {
            font-size: 24px;
            color: #222;
        }

        .rating {
            background-color: green;
            color: white;
            display: inline-block;
            padding: 5px 8px;
            border-radius: 4px;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
            color: #222;
        }

        .old-price {
            color: gray;
            text-decoration: line-through;
            margin-left: 8px;
            font-size: 16px;
        }

        .offer {
            color: green;
            font-weight: bold;
        }

        .buy-button {
            background-color: #2874f0;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        /* Breakpoint 1: Mobile - 600px and below */
        @media only screen and (max-width: 600px) {
            body {
                padding: 10px;
            }

            .product-card {
                flex-direction: column;
                text-align: center;
                padding: 15px;
                gap: 10px;
            }

            .product-card img {
                width: 180px;
                height: 180px;
            }

            .product-details h2 {
                font-size: 18px;
            }

            .product-details p {
                font-size: 14px;
            }

            .price {
                font-size: 20px;
            }
        }

        /* Breakpoint 2: Tablet - 601px to 900px */
        @media only screen and (min-width: 601px) and (max-width: 900px) {
            .product-card {
                padding: 20px;
                gap: 18px;
            }

            .product-card img {
                width: 200px;
                height: 200px;
            }

            .product-details h2 {
                font-size: 21px;
            }

            .product-details p {
                font-size: 15px;
            }
        }

        /* Breakpoint 3: Medium desktop - 901px to 1200px */
        @media only screen and (min-width: 901px) and (max-width: 1200px) {
            .product-card {
                padding: 30px;
            }

            .product-details h2 {
                font-size: 25px;
            }

            .product-details p {
                font-size: 17px;
            }
        }

        /* Large desktop - above 1200px */
        @media only screen and (min-width: 1201px) {
            .product-card {
                padding: 35px;
            }

            .product-details h2 {
                font-size: 28px;
            }

            .product-details p {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <h1>Flipkart-Style Product Card</h1>

    <div class="product-card">

        <img
            src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
            alt="Wireless Headphones">

        <div class="product-details">
            <h2>Wireless Bluetooth Headphones</h2>

            <p>
                Enjoy high-quality sound, comfortable ear cushions
                and wireless connectivity.
            </p>

            <p><span class="rating">4.3 ★</span> 1,250 Ratings</p>

            <p>
                <span class="price">₹1,499</span>
                <span class="old-price">₹2,999</span>
            </p>

            <p class="offer">50% off</p>

            <button class="buy-button">Buy Now</button>
        </div>

    </div>

</body>
</html>
