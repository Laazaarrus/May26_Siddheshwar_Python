<!DOCTYPE html>
<html>
<head>
    <title>Social Link Preview</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            background-color: lightblue;
        }

        .card {
            margin-top: 15px;
            padding: 15px;
        }

        .instagram {
            border-left: 5px solid #e1306c;
        }

        .linkedin {
            border-left: 5px solid #0a66c2;
        }

        .spotify {
            border-left: 5px solid #1db954;
        }
    </style>
</head>

<body>

    <div class="container mt-4">

        <h2>My Social Links</h2>

        <form id="myForm">

            <label>Instagram URL</label>
            <input type="url" id="instagram" class="form-control mb-3"
                   placeholder="Enter Instagram URL">

            <label>LinkedIn URL</label>
            <input type="url" id="linkedin" class="form-control mb-3"
                   placeholder="Enter LinkedIn URL">

            <label>Spotify URL</label>
            <input type="url" id="spotify" class="form-control mb-3"
                   placeholder="Enter Spotify URL">

            <button type="submit" class="btn btn-primary">
                Show Preview
            </button>

        </form>

        <div id="preview"></div>

    </div>

    <script>
        document.getElementById("myForm").onsubmit = function(event) {

            event.preventDefault();

            var instagram = document.getElementById("instagram").value;
            var linkedin = document.getElementById("linkedin").value;
            var spotify = document.getElementById("spotify").value;

            var result = "";

            if (instagram != "") {
                var name1 = instagram.split("/").filter(Boolean).pop();

                result += `
                    <div class="card instagram">
                        <h5><i class="bi bi-instagram"></i> Instagram</h5>
                        <p>@${name1}</p>
                        <a href="${instagram}" target="_blank" class="btn btn-danger">Visit</a>
                    </div>
                `;
            }

            if (linkedin != "") {
                var name2 = linkedin.split("/").filter(Boolean).pop();

                result += `
                    <div class="card linkedin">
                        <h5><i class="bi bi-linkedin"></i> LinkedIn</h5>
                        <p>@${name2}</p>
                        <a href="${linkedin}" target="_blank" class="btn btn-primary">Visit</a>
                    </div>
                `;
            }

            if (spotify != "") {
                var name3 = spotify.split("/").filter(Boolean).pop();

                result += `
                    <div class="card spotify">
                        <h5><i class="bi bi-spotify"></i> Spotify</h5>
                        <p>@${name3}</p>
                        <a href="${spotify}" target="_blank" class="btn btn-success">Visit</a>
                    </div>
                `;
            }

            if (result == "") {
                result = "<p>Please enter at least one link.</p>";
            }

            document.getElementById("preview").innerHTML = result;
        };
    </script>

</body>
</html>
