<!DOCTYPE html>
<html>
<head>
    <title>Gamer Tag Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #202033;
            color: white;
            font-family: Arial, sans-serif;
        }

        .profile {
            text-align: center;
            background-color: #343450;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            margin: 50px auto;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile a {
            display: block;
            margin: 12px auto;
            max-width: 250px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="profile">

            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=300"
                 class="avatar" alt="Gamer avatar">

            <h1 class="mt-3">ShadowGamer</h1>
            <p>Gamer | Streamer | Music Lover</p>

            <a href="https://www.twitch.tv/" class="btn btn-primary">
                <i class="bi bi-twitch"></i> Twitch
            </a>

            <a href="https://discord.com/" class="btn btn-secondary">
                <i class="bi bi-discord"></i> Discord
            </a>

            <a href="https://store.steampowered.com/" class="btn btn-info">
                <i class="bi bi-steam"></i> Steam
            </a>

        </div>
    </div>

</body>
</html>
