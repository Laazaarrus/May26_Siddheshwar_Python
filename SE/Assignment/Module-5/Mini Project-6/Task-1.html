<!DOCTYPE html>
<html>
<head>
    <title>Music Links Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            background-color: lightblue;
        }

        .preview {
            background-color: white;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="container mt-4">
        <h2>My Music Links</h2>

        <form id="musicLinksForm">

            <label class="form-label">Spotify URL</label>
            <input type="url" id="spotify" class="form-control mb-3"
                   placeholder="Enter Spotify link">

            <label class="form-label">YouTube Music URL</label>
            <input type="url" id="youtube" class="form-control mb-3"
                   placeholder="Enter YouTube Music link">

            <label class="form-label">Apple Music URL</label>
            <input type="url" id="apple" class="form-control mb-3"
                   placeholder="Enter Apple Music link">

            <button type="submit" class="btn btn-success">
                Show Links
            </button>

        </form>

        <div id="previewArea" class="mt-4"></div>
    </div>

    <script>
        document.getElementById("musicLinksForm").addEventListener("submit", function(event) {
            event.preventDefault();

            var preview = document.getElementById("previewArea");
            preview.innerHTML = "";

            var platforms = [
                { id: "spotify", name: "Spotify", icon: "bi-spotify" },
                { id: "youtube", name: "YouTube Music", icon: "bi-youtube" },
                { id: "apple", name: "Apple Music", icon: "bi-apple" }
            ];

            platforms.forEach(function(platform) {
                var url = document.getElementById(platform.id).value.trim();

                if (url !== "") {
                    try {
                        var link = new URL(url);

                        if (link.protocol !== "https:" && link.protocol !== "http:") {
                            return;
                        }

                        var card = document.createElement("div");
                        card.className = "preview";

                        var title = document.createElement("h5");
                        title.innerHTML = '<i class="bi ' + platform.icon + '"></i> ';
                        title.appendChild(document.createTextNode(platform.name));

                        var button = document.createElement("a");
                        button.href = link.href;
                        button.target = "_blank";
                        button.rel = "noopener noreferrer";
                        button.className = "btn btn-primary";
                        button.textContent = "Visit";

                        card.appendChild(title);
                        card.appendChild(button);
                        preview.appendChild(card);

                    } catch (error) {
                        alert("Please enter a valid URL for " + platform.name);
                    }
                }
            });

            if (preview.innerHTML === "") {
                preview.textContent = "Please enter at least one music link.";
            }
        });
    </script>

</body>
</html>
